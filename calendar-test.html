<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a93226"><title>Christmas Card Collector — Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{height:100svh;color:#fff8e9;font-family:Nunito,system-ui,sans-serif;background:linear-gradient(135deg,rgba(48,15,22,.12),rgba(94,25,20,.08)),url("./Background.jpg") center center / cover no-repeat fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:38px 38px}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(12px,3vw,30px);border-bottom:1px solid #ffffff30;background:#4a171b44;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#ffcf70,#e85b3b);box-shadow:0 4px 0 #6c2422;font-size:23px}.eyebrow{font-size:.62rem;letter-spacing:.18em;color:#ffdfaa;font-weight:900}h1{font:700 clamp(1.25rem,3vw,2rem)/1 Fredoka;margin:3px 0 0;text-shadow:0 3px 0 #69251f}.top-right{display:flex;align-items:center;gap:10px}.music-toggle{border:1px solid #ffffff66;border-radius:30px;padding:8px 12px;background:#461c1e99;color:#fff3d6;font:900 .72rem Nunito;cursor:pointer;white-space:nowrap}.music-toggle:hover{background:#743027}.counter{padding:8px 13px;border:1px solid #ffffff50;border-radius:30px;background:#461c1e88;font-size:.78rem;font-weight:900;white-space:nowrap}.counter b{color:#ffd16c}
nav{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;padding:10px 12px 8px}.tab{border:1px solid #ffffff55;border-radius:999px;padding:9px 18px;color:#fff5e4;background:#ffffff12;font:900 .78rem Nunito;cursor:pointer}.tab.active{background:#ffe1a5;color:#76251f;border-color:#ffe1a5;box-shadow:0 3px 0 #6b2923}
main{position:relative;z-index:1;height:calc(100svh - 112px);min-height:0;width:min(1120px,96vw);margin:0 auto;padding:4px 0 12px}.view{height:100%;min-height:0;border:1px solid #ffffff45;border-radius:22px;background:linear-gradient(135deg,#ffffff20,#32141966);box-shadow:0 16px 45px #32100d66,inset 0 1px #ffffff55;backdrop-filter:blur(10px);padding:clamp(8px,1.4vw,14px);display:none}.view.active{display:flex;flex-direction:column}.view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;padding:1px 4px 10px}.view-head h2{font:700 clamp(1rem,2.4vw,1.4rem) Fredoka;margin:0}.hint{font-size:.72rem;color:#ffe5c2;text-align:right}
.door-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(5px,1vw,11px)}
.door{position:relative;min-width:0;min-height:0;border:3px solid #6b351d;border-radius:10px;overflow:hidden;cursor:pointer;background:linear-gradient(145deg,#ffe5b0,#b97837);box-shadow:0 5px 0 #4c2417,0 9px 16px #28100b88,inset 0 0 0 2px #f8d18a;isolation:isolate}.door:nth-child(3n){background:linear-gradient(145deg,#f5d49a,#9e542c)}.door:nth-child(4n){background:linear-gradient(145deg,#ffdfa0,#a65b2c)}.door:disabled{cursor:not-allowed;filter:saturate(.75) brightness(.82)}
.door-img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain;object-position:center bottom;opacity:0;transform:scale(.65) translateY(10px);transition:.45s .18s;filter:drop-shadow(0 3px 4px #47201d88)}.door.collected .door-img{opacity:1;transform:scale(1) translateY(0)}
.door-cover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #f4c77c;border-radius:6px;color:#fff3cf;background:repeating-linear-gradient(90deg,transparent 0 17%,#ffffff0b 18% 19%),linear-gradient(100deg,#71351f,#b65b2d 48%,#71351f);box-shadow:inset 0 0 0 5px #6b321f,inset 0 0 0 7px #e4aa5c,inset 5px 0 14px #fff2c022,0 2px 4px #32130d88;transform-origin:left center;backface-visibility:hidden;transition:transform .78s cubic-bezier(.2,.75,.25,1)}.door:nth-child(3n) .door-cover{background:repeating-linear-gradient(90deg,transparent 0 17%,#ffffff0b 18% 19%),linear-gradient(100deg,#174c37,#287c50 48%,#174c37)}.door:nth-child(4n) .door-cover{background:repeating-linear-gradient(90deg,transparent 0 17%,#ffffff0b 18% 19%),linear-gradient(100deg,#74401d,#c17a32 48%,#74401d)}.door-cover:before{content:"";position:absolute;inset:12% 13%;border:2px solid #f4ce8b;border-radius:5px;box-shadow:inset 0 0 0 3px #5d2b1d,inset 0 0 0 5px #d89b51,0 0 0 1px #532719}.door-cover:after{content:"";position:absolute;right:12%;top:48%;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff4b8,#e8b64f 45%,#704018 80%);border:1px solid #683819;box-shadow:0 1px 3px #32140d}.door:hover:not(:disabled):not(.collected) .door-cover{filter:brightness(1.22)}
.day{font:700 clamp(1.2rem,4vh,2.6rem) Fredoka;text-shadow:0 3px 0 #0005;color:#ffe5a7}.door-caption{font-size:clamp(.42rem,1vh,.62rem);font-weight:900;letter-spacing:.08em;margin-top:4px;color:#fff2d4}.door.collected .door-cover{transform:perspective(700px) rotateY(-112deg);pointer-events:none}
.album-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(5px,1vw,11px)}
.card{position:relative;min-width:0;min-height:0;border-radius:12px;padding:5px;background:linear-gradient(145deg,#f8d88f,#b87b3e);box-shadow:0 4px 0 #57231e,0 8px 15px #28101566;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;color:#54251e;text-align:center}.card.rare{background:linear-gradient(145deg,#c6e8ff,#5795c5)}.card.epic{background:linear-gradient(145deg,#e8c6ff,#9160bd)}.card.legendary{background:linear-gradient(145deg,#fff0a6,#e5a22d)}.card img{width:100%;height:72%;object-fit:contain;filter:drop-shadow(0 2px 3px #4a251c66)}.card-name{font:700 clamp(.55rem,1.35vw,.85rem)/1 Fredoka;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rarity{font-size:clamp(.4rem,.8vw,.55rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.empty{border:1px dashed #ffffff55;border-radius:12px;background:#ffffff0a;display:grid;place-items:center;color:#ffdfbd;font-size:clamp(.55rem,1.2vw,.8rem);font-weight:900}.empty span{opacity:.65}

.unlock-modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:#160b0acc;backdrop-filter:blur(7px)}.unlock-modal.open{display:grid;animation:modalFade .22s ease-out}@keyframes modalFade{from{opacity:0}to{opacity:1}}.unlock-panel{position:relative;width:min(420px,94vw);max-height:88svh;overflow:auto;border:3px solid #f5d18a;border-radius:24px;padding:22px 22px 18px;text-align:center;color:#5b291b;background:radial-gradient(circle at 50% 0%,#fff7d7,#f4cf88 70%,#d99b4d);box-shadow:0 0 0 6px #6a2c1e,0 22px 70px #0009}.unlock-ribbon{display:inline-block;border-radius:30px;padding:6px 14px;background:#a82e28;color:#fff0ca;font-size:.7rem;font-weight:1000;letter-spacing:.14em}.unlock-image{display:block;width:min(220px,58vw);height:190px;object-fit:contain;margin:8px auto 0;filter:drop-shadow(0 7px 5px #67321d55);animation:popIn .42s cubic-bezier(.2,.8,.2,1)}@keyframes popIn{from{transform:scale(.45) rotate(-9deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}.unlock-panel h2{font:700 2rem Fredoka;margin:2px 0 5px;color:#7a2d20}.unlock-rarity{font-size:.72rem;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;color:#a15a20}.unlock-description{font-size:.94rem;line-height:1.5;margin:10px 0 17px;color:#653a27}.unlock-close{border:0;border-radius:999px;padding:11px 25px;background:linear-gradient(135deg,#b9362c,#7d211e);color:#fff5df;font:900 .9rem Nunito;box-shadow:0 4px 0 #572019;cursor:pointer}.unlock-close:active{transform:translateY(2px);box-shadow:0 2px 0 #572019}@media(max-width:650px){.unlock-panel{padding:16px 17px 14px}.unlock-image{height:155px}.unlock-panel h2{font-size:1.7rem}}
footer{flex:none;text-align:center;padding:7px 8px 0;color:#ffe5c2;font-size:.65rem}
@media(max-width:650px){.music-toggle{padding:7px 9px;font-size:.62rem}header{padding:8px 10px}.brand-mark{width:34px;height:34px;font-size:19px}.eyebrow{font-size:.5rem}h1{font-size:1.2rem}.counter{padding:7px 9px;font-size:.68rem}nav{padding:7px 8px}.tab{padding:8px 14px}main{height:calc(100svh - 102px);width:98vw}.view{padding:7px;border-radius:15px}.door-grid,.album-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:5px}.door,.card,.empty{border-radius:8px}.view-head{padding-bottom:7px}.hint{font-size:.62rem}}
@media(max-height:560px){header{padding:5px 12px}.brand-mark{width:30px;height:30px}.subtitle{display:none}nav{padding:4px}main{height:calc(100svh - 85px)}footer{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head><body>
<header><div class="brand"><div class="brand-mark">✦</div><div><div class="eyebrow">ROHAN'S CHRISTMAS COLLECTION</div><h1>Festive Card Collector</h1></div></div><div class="top-right"><button class="music-toggle" id="musicToggle" type="button" aria-pressed="false">♫ Play music</button><div class="counter"><b id="count">0</b> / 24 CARDS</div></div></header>
<nav><button class="tab active" data-view="doors">Advent Packs</button><button class="tab" data-view="album">My Collection</button></nav>
<main>
<section class="view active" id="doors"><div class="view-head"><h2>Open a Christmas pack</h2><div class="hint" id="status">TEST MODE · All packs unlocked</div></div><div class="door-grid" id="doorGrid"></div></section>
<section class="view" id="album"><div class="view-head"><h2>My card album</h2><div class="hint" id="albumStatus">Your festive cards appear here</div></div><div class="album-grid" id="albumGrid"></div></section>
</main><audio id="christmasMusic" src="https://raw.githubusercontent.com/Rohansweb-codexamples/Projects/main/viacheslavstarostin-we-wish-you-a-merry-christmas-444573.mp3" loop preload="auto"></audio><div class="unlock-modal" id="unlockModal" role="dialog" aria-modal="true" aria-labelledby="unlockName"><div class="unlock-panel"><div class="unlock-ribbon">NEW CARD UNLOCKED</div><img class="unlock-image" id="unlockImage" alt=""><h2 id="unlockName"></h2><div class="unlock-rarity" id="unlockRarity"></div><p class="unlock-description" id="unlockDescription"></p><button class="unlock-close" id="unlockClose" type="button">Add to my collection</button></div></div><footer>Collect all 24 festive characters · Your collection saves on this device</footer>
<script>

const christmasMusic=document.getElementById("christmasMusic");const musicToggle=document.getElementById("musicToggle");let musicStarted=false;function syncMusicButton(){musicToggle.textContent=christmasMusic.paused?"♫ Play music":"♫ Music on";musicToggle.setAttribute("aria-pressed",String(!christmasMusic.paused))}async function startChristmasMusic(){try{christmasMusic.volume=.38;await christmasMusic.play();musicStarted=true;syncMusicButton();return true}catch(error){syncMusicButton();return false}}musicToggle.addEventListener("click",async()=>{if(christmasMusic.paused){await startChristmasMusic()}else{christmasMusic.pause();syncMusicButton()}});window.addEventListener("load",()=>{startChristmasMusic()},{once:true});const unlockMusicOnce=()=>{if(!musicStarted){startChristmasMusic()}window.removeEventListener("pointerdown",unlockMusicOnce);window.removeEventListener("keydown",unlockMusicOnce)};window.addEventListener("pointerdown",unlockMusicOnce,{once:true});window.addEventListener("keydown",unlockMusicOnce,{once:true});christmasMusic.addEventListener("play",syncMusicButton);christmasMusic.addEventListener("pause",syncMusicButton);
const TEST_MODE=true;
const images=["01-reindeer.png","02-christmas-elf.png","03-polar-bear.png","04-christmas-sheep.png","05-christmas-lights.png","06-christmas-lantern.png","07-christmas-rabbit.png","08-nutcracker.png","09-jingle-bells.png","10-candy-cane.png","11-santa-claus.png","12-christmas-pudding.png","13-christmas-tree.png","14-christmas-penguin.png","15-christmas-present.png","16-snowman.png","17-christmas-bauble.png"];
const names=["Reindeer","Christmas Elf","Polar Bear","Christmas Sheep","Christmas Lights","Christmas Lantern","Christmas Rabbit","Nutcracker","Jingle Bells","Candy Cane","Santa Claus","Christmas Pudding","Christmas Tree","Christmas Penguin","Christmas Present","Snowman","Christmas Bauble","Reindeer","Christmas Elf","Polar Bear","Christmas Sheep","Christmas Lights","Christmas Lantern","Christmas Rabbit"];
const rarities=["legendary","common","rare","common","epic","common","rare","common","epic","common","rare","common","epic","rare","common","legendary","rare","common","epic","common","rare","common","epic","legendary"];
const descriptions=["A cheerful reindeer from Santa's sleigh team, ready to guide the way through the snowy night.","A playful little elf who helps prepare presents and spread Christmas magic.","A friendly polar bear who loves snowy adventures and warm festive scarves.","A fluffy Christmas sheep bringing a little extra cosiness to the collection.","Colourful Christmas lights to brighten the darkest winter evening.","A glowing festive lantern surrounded by beautiful Christmas decorations.","A soft and cuddly rabbit dressed for a magical Christmas.","A traditional toy soldier standing proudly guard over the presents.","A set of shiny jingle bells that ring out across the winter wonderland.","A sweet candy cane decorated with a festive red bow.","Santa Claus himself, ready to deliver presents on Christmas Eve.","A delicious Christmas pudding topped with holly and festive cheer.","A cheerful Christmas tree sparkling with decorations and lights.","A happy little penguin wrapped up warm for the winter celebrations.","A special wrapped present waiting to be discovered.","A friendly snowman with a warm hat and a bright red scarf.","A sparkling Christmas bauble ready to decorate the tree."];
const key="rohansweb-xmas-card-collection-v2";
let collected=new Set();try{const saved=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(saved))collected=new Set(saved.filter(n=>Number.isInteger(n)&&n>=1&&n<=24))}catch{}
const today=new Date();const unlocked=TEST_MODE?24:(today.getMonth()===11?Math.min(24,today.getDate()):0);
const path=name=>"./"+encodeURIComponent(name);
const count=document.getElementById("count"),doorGrid=document.getElementById("doorGrid"),albumGrid=document.getElementById("albumGrid");
function persist(){try{localStorage.setItem(key,JSON.stringify([...collected].sort((a,b)=>a-b)))}catch{}}
function updateCount(){count.textContent=collected.size;document.getElementById("albumStatus").textContent=collected.size+" collected · "+(24-collected.size)+" still to find"}
function showAlbum(){albumGrid.innerHTML="";for(let day=1;day<=24;day++){if(collected.has(day)){const card=document.createElement("article");card.className="card "+rarities[day-1];const img=document.createElement("img");img.src=path(images[(day-1)%images.length]);img.alt=names[day-1];const name=document.createElement("div");name.className="card-name";name.textContent=names[day-1];const rarity=document.createElement("div");rarity.className="rarity";rarity.textContent=rarities[day-1];card.append(img,name,rarity);albumGrid.append(card)}else{const empty=document.createElement("div");empty.className="empty";empty.innerHTML="<span>✦<br>DAY "+String(day).padStart(2,"0")+"<br>?</span>";albumGrid.append(empty)}}updateCount()}
function showUnlock(day){const i=(day-1)%images.length;document.getElementById("unlockImage").src=path(images[i]);document.getElementById("unlockImage").alt=names[day-1];document.getElementById("unlockName").textContent=names[day-1];document.getElementById("unlockRarity").textContent=rarities[day-1]+" card · Day "+String(day).padStart(2,"0");document.getElementById("unlockDescription").textContent=descriptions[i];document.getElementById("unlockModal").classList.add("open")}function closeUnlock(){document.getElementById("unlockModal").classList.remove("open")}document.getElementById("unlockClose").addEventListener("click",closeUnlock);document.getElementById("unlockModal").addEventListener("click",e=>{if(e.target.id==="unlockModal")closeUnlock()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeUnlock()});
function makeDoor(day){const btn=document.createElement("button");btn.className="door";btn.type="button";btn.disabled=day>unlocked;const img=document.createElement("img");img.className="door-img";img.src=path(images[(day-1)%images.length]);img.alt=names[day-1];const cover=document.createElement("span");cover.className="door-cover";const n=document.createElement("span");n.className="day";n.textContent=String(day).padStart(2,"0");const cap=document.createElement("span");cap.className="door-caption";cap.textContent=day>unlocked?"LOCKED":collected.has(day)?"COLLECTED":"OPEN PACK";cover.append(n,cap);btn.append(img,cover);if(collected.has(day))btn.classList.add("collected");btn.setAttribute("aria-label","Day "+day+(day>unlocked?" locked":collected.has(day)?" collected":" open card pack"));btn.addEventListener("click",()=>{if(day>unlocked||collected.has(day))return;collected.add(day);persist();btn.classList.add("collected");cap.textContent="COLLECTED";btn.setAttribute("aria-label","Day "+day+" collected "+names[day-1]);showAlbum();showUnlock(day)});doorGrid.append(btn)}
for(let d=1;d<=24;d++)makeDoor(d);showAlbum();
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===tab));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===tab.dataset.view))}));
if(!TEST_MODE&&unlocked===0)document.getElementById("status").textContent="First pack unlocks on 1 December";
else if(!TEST_MODE)document.getElementById("status").textContent="Day "+unlocked+" available · "+collected.size+" collected";
</script></body></html>
