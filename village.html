<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b46"><title>Explore the North Pole | Christmas Wonderland</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09213b;font-family:Nunito,Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#0b2947}.scene{position:absolute;width:100%;height:100%;inset:0;object-fit:fill;user-select:none;pointer-events:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#071a3b30,transparent 22%,transparent 75%,#071a3b35)}#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}.top{position:absolute;z-index:12;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand,.back{pointer-events:auto;color:white;text-decoration:none;font-weight:1000;text-shadow:0 2px 8px #09213b;background:#092b49b8;border:1px solid #ffffff55;border-radius:30px;padding:10px 16px;backdrop-filter:blur(8px)}.brand{font:700 20px Fredoka}.back{font-size:13px}.hotspot{position:absolute;z-index:5;border:2px solid transparent;background:#ffffff00;border-radius:22px;cursor:pointer;transform:translate(-50%,-50%);transition:.2s}.hotspot:hover,.hotspot:focus-visible{border-color:#ffe58b;background:#ffe58b25;box-shadow:0 0 0 5px #ffdc7540,0 0 30px #fff4a9;outline:0}.hotspot:after{content:attr(data-label);position:absolute;left:50%;top:100%;transform:translate(-50%,8px);white-space:nowrap;background:#fff4d8;color:#75341c;border:2px solid #d88b37;border-radius:20px;padding:7px 12px;font:900 12px Nunito;box-shadow:0 4px 14px #061c3866;opacity:0;transition:.2s}.hotspot:hover:after,.hotspot:focus-visible:after{opacity:1}.home{left:72.5%;top:33%;width:15%;height:22%;display:flex;align-items:flex-end;justify-content:center;text-decoration:none;border:3px solid #ffe08b;background:#ffd87922;box-shadow:0 0 0 5px #ffdc7540,0 0 28px #ffe08b99;animation:homeGlow 1.8s ease-in-out infinite}.home span{display:block;margin-bottom:-17px;padding:10px 13px;border:2px solid #ffe6a2;border-radius:22px;background:#a62f28;color:#fff9e8;font:1000 clamp(9px,1vw,13px) Nunito,Arial,sans-serif;white-space:nowrap;text-align:center;box-shadow:0 4px 18px #071a3c99}.home:hover{background:#ffe08b55;transform:translate(-50%,-50%) scale(1.04)}@keyframes homeGlow{50%{box-shadow:0 0 0 9px #ffdc7520,0 0 38px #ffe08bcc}}.workshop{left:16%;top:37%;width:19%;height:38%;border-color:#ffd879;background:#ffd87912}.workshop:after{content:"TOY DESIGN STUDIO · ENTER";opacity:1;top:8%;padding:9px 13px;background:#a62f28;color:#fff8df;border:2px solid #ffe09a;font-size:clamp(9px,1vw,13px);letter-spacing:.5px;box-shadow:0 4px 18px #071a3c99}.games{left:86%;top:38%;width:19%;height:35%}.castle{left:61%;top:14%;width:17%;height:27%}.rink{left:36%;top:29%;width:19%;height:22%}.tree{left:51%;top:34%;width:17%;height:33%}.post{left:27%;top:49%;width:8%;height:18%}.characters{position:absolute;inset:0;z-index:7;pointer-events:none}.walker{position:absolute;width:clamp(42px,5vw,82px);height:clamp(55px,7.8vw,112px);object-fit:contain;filter:drop-shadow(0 7px 5px #071a3c88);transform:translate(-50%,-82%);will-change:left,top}.walker:nth-child(2){width:clamp(36px,4.4vw,68px)}.walker:nth-child(3){width:clamp(40px,4.8vw,74px)}.walker:nth-child(4){width:clamp(38px,4.5vw,70px)}.panel{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(420px,calc(100vw - 34px));padding:25px;border:3px solid #f7d887;border-radius:26px;background:linear-gradient(145deg,#fff9e9,#ffedcf);box-shadow:0 22px 80px #061b39a8;color:#274255;opacity:0;visibility:hidden;transition:.2s}.panel.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}.panel h2{font:700 30px Fredoka;margin:0 35px 8px 0;color:#a12d2d}.panel p{line-height:1.55;font-weight:700;color:#526773;margin:0 0 17px}.panel .close{position:absolute;right:13px;top:12px;border:0;border-radius:50%;width:34px;height:34px;background:#f4d9b0;font-size:21px;cursor:pointer}.panel .visit{display:inline-block;border-radius:22px;background:#17684e;color:white;padding:11px 17px;text-decoration:none;font-weight:1000}.hint{position:absolute;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:9px 15px;border-radius:22px;background:#092b49c9;border:1px solid #ffffff55;color:#fff;font-size:12px;font-weight:900;backdrop-filter:blur(8px);pointer-events:none}
@media(max-width:650px){.top{top:10px;left:10px;right:10px}.brand{font-size:16px;padding:8px 12px}.back{font-size:11px;padding:8px 11px}.hint{bottom:10px;font-size:10px}.hotspot:after{font-size:10px}.walker{width:48px;height:64px}}
@media(prefers-reduced-motion:reduce){.hotspot,.panel{transition:none}}
</style></head>
<body>
<div class="stage" id="stage">
<img class="scene" src="Whimsical North Pole Christmas Village.png" alt="A snowy Christmas village with Santa's Workshop, the Games Village, a castle, a frozen pond and winding paths">
<div class="shade"></div>
<header class="top"><a class="brand" href="./">Christmas Wonderland</a><a class="back" href="./">← Back to homepage</a></header>
<a class="hotspot home" href="christmas-home.html" data-label="DECORATE SANTA’S HOUSE" aria-label="Enter Santa’s house to decorate all five rooms"><span>DECORATE<br>SANTA’S HOUSE</span></a>
<button class="hotspot workshop" data-place="workshop" data-label="Santa's Workshop" aria-label="Explore Santa's Workshop"></button>
<button class="hotspot games" data-place="games" data-label="Games Village" aria-label="Explore the Games Village"></button>
<button class="hotspot castle" data-place="castle" data-label="Ice Palace" aria-label="Explore the Ice Palace"></button>
<button class="hotspot rink" data-place="rink" data-label="Frozen Lake" aria-label="Explore the Frozen Lake"></button>
<button class="hotspot tree" data-place="tree" data-label="Christmas Square" aria-label="Explore Christmas Square"></button>
<button class="hotspot post" data-place="post" data-label="North Pole Post" aria-label="Explore the North Pole Post Office"></button>
<svg id="routes" viewBox="0 0 1672 941" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none">
<path id="route1" d="M 15 570 C 190 590 360 655 500 650 S 620 610 690 550 S 760 500 830 500 S 990 610 1160 625 S 1430 600 1660 555" fill="none"/>
<path id="route2" d="M 430 650 C 520 620 580 560 660 520 S 760 470 820 450 S 950 510 1030 570 S 1280 600 1510 560" fill="none"/>
<path id="route3" d="M 900 650 C 1060 680 1210 665 1330 620 S 1450 560 1480 490 S 1450 420 1390 390" fill="none"/>
</svg>
<div class="characters">
<img class="walker" data-route="route1" data-speed="0.000035" src="01-reindeer.png" alt="">
<img class="walker" data-route="route2" data-speed="0.000027" src="02-christmas-elf.png" alt="">
<img class="walker" data-route="route3" data-speed="0.000031" src="07-christmas-rabbit.png" alt="">
<img class="walker" data-route="route1" data-speed="0.000022" src="14-christmas-penguin.png" alt="">
</div>
<canvas id="snow"></canvas>
<div class="hint">Click the glowing house on the right to decorate Santa’s home · Visit the workshop on the left to design a toy</div>
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
<button class="close" id="close" aria-label="Close">×</button><h2 id="panelTitle">Welcome!</h2><p id="panelText"></p><a class="visit" id="panelLink" href="./">Explore</a>
</section>
</div>
<script>
const places={
home:{title:"Santa’s Christmas Home",text:"Step inside Santa’s cosy home and decorate five different 3D rooms — the living room, kitchen, bedroom, dining room and Christmas study.",link:"christmas-home.html",label:"Enter Santa’s Home"},
workshop:{title:"Santa's Workshop",text:"The elves are busy making presents, wrapping parcels and checking Santa's list. Design your very own toy in the 3D toy workshop.",link:"toy-workshop.html",label:"Enter Toy Design Studio"},
games:{title:"Games Village",text:"Welcome to the Games Village! The reindeer are ready for a snowy challenge. Can you beat your best score?",link:"race.html",label:"Play Reindeer Dash"},
castle:{title:"The Ice Palace",text:"High above the village, the Ice Palace shines beneath the Northern Lights. Santa's sleigh can be spotted flying past the moon.",link:"calendar.html",label:"See the Advent Calendar"},
rink:{title:"The Frozen Lake",text:"The village lake has frozen into a sparkling skating rink. Follow the lights around the water and enjoy the winter view.",link:"calendar.html",label:"Find a Christmas surprise"},
tree:{title:"Christmas Square",text:"The giant Christmas tree is the heart of the village. It is covered in lights and surrounded by presents waiting to be discovered.",link:"tree.html",label:"Decorate the Tree"},
post:{title:"North Pole Post Office",text:"Letters from children all over the world arrive here. The post elves are sorting them ready for Santa.",link:"calendar.html",label:"Open the Advent Calendar"}
};
const panel=document.getElementById('panel');
document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>{const p=places[b.dataset.place];document.getElementById('panelTitle').textContent=p.title;document.getElementById('panelText').textContent=p.text;const a=document.getElementById('panelLink');a.href=p.link;a.textContent=p.label;panel.classList.add('open')}));
document.getElementById('close').addEventListener('click',()=>panel.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('open')});
const stage=document.getElementById('stage'), walkers=[...document.querySelectorAll('.walker')];
const routes=walkers.map(el=>({el,path:document.getElementById(el.dataset.route),length:0,offset:Math.random(),speed:Number(el.dataset.speed)}));
routes.forEach(r=>r.length=r.path.getTotalLength());
let last=0;
function move(t){const w=stage.clientWidth,h=stage.clientHeight;routes.forEach(r=>{const d=(t*r.speed+r.offset)%1,pt=r.path.getPointAtLength(d*r.length),next=r.path.getPointAtLength(((d+.002)%1)*r.length);const x=pt.x/1672*w,y=pt.y/941*h;r.el.style.left=x+'px';r.el.style.top=y+'px';r.el.style.transform='translate(-50%,-82%) scaleX('+(next.x<pt.x?-1:1)+')'});requestAnimationFrame(move)}requestAnimationFrame(move);
const canvas=document.getElementById('snow'),ctx=canvas.getContext('2d');let flakes=[];
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);flakes=Array.from({length:Math.min(180,Math.floor(innerWidth/7))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.5+.6,v:Math.random()*1.2+.5,drift:Math.random()*.8-.4,alpha:Math.random()*.65+.25}))}
function snow(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const f of flakes){ctx.beginPath();ctx.fillStyle='rgba(255,255,255,'+f.alpha+')';ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();f.y+=f.v;f.x+=f.drift+Math.sin(f.y/35)*.25;if(f.y>innerHeight+5){f.y=-5;f.x=Math.random()*innerWidth}if(f.x>innerWidth+5)f.x=-5;if(f.x< -5)f.x=innerWidth+5}requestAnimationFrame(snow)}addEventListener('resize',resize);resize();snow();
</script><style>
#xmas-screen-tools{position:fixed;z-index:99999;right:14px;bottom:14px;display:flex;gap:8px;align-items:center}
#xmas-screen-tools button{border:1px solid #fff8;border-radius:24px;padding:11px 15px;background:#102d43eF;color:#fff;font:900 12px Nunito,Arial,sans-serif;box-shadow:0 5px 18px #061a2c66;cursor:pointer;backdrop-filter:blur(8px)}
#xmas-screen-tools button:hover{background:#a83232}
html.xmas-fullscreen,html.xmas-fullscreen body{width:100%;height:100%;min-height:100%;margin:0}
html.xmas-fullscreen body{overflow:auto}
:fullscreen{background:#092b3b}
@media(max-width:600px){#xmas-screen-tools{right:8px;bottom:8px}#xmas-screen-tools button{padding:10px 12px;font-size:11px}}
</style>
<div id="xmas-screen-tools"><button id="xmas-music" type="button">▶ Play Christmas music</button><button id="xmas-fullscreen" type="button">⛶ Full screen</button></div>
<audio id="xmas-background-music" src="https://projects.rohansweb.co.uk/viacheslavstarostin-we-wish-you-a-merry-christmas-444573.mp3" loop preload="auto" autoplay></audio>
<script>
(()=>{const audio=document.getElementById('xmas-background-music'),music=document.getElementById('xmas-music'),full=document.getElementById('xmas-fullscreen');let started=false;
async function startMusic(){try{await audio.play();started=true;music.textContent='♫ Music on'}catch(e){music.textContent='▶ Tap to play music'}}
music.addEventListener('play',()=>{music.textContent='♫ Music on'});music.addEventListener('pause',()=>{music.textContent='▶ Play Christmas music'});
music.addEventListener('error',()=>{music.textContent='Music unavailable'});
music.addEventListener('ended',()=>{audio.currentTime=0;startMusic()});
music.addEventListener('click',()=>{if(audio.paused)startMusic();else audio.pause()});
startMusic();
document.addEventListener('pointerdown',()=>{if(!started&&audio.paused)startMusic()},{once:true});
full.addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();full.textContent='⤢ Exit full screen'}else{await document.exitFullscreen();full.textContent='⛶ Full screen'}}catch(e){full.textContent='Full screen unavailable'}});
document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'⤢ Exit full screen':'⛶ Full screen'});
})();
</script></body></html>
