<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b94316"><title>Rohan's Christmas Calendar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{height:100svh;display:flex;flex-direction:column;color:#fff8e9;font-family:Nunito,system-ui,sans-serif;background:radial-gradient(ellipse at 12% 0%,#ffb04b 0,transparent 36%),radial-gradient(ellipse at 90% 20%,#e65b2e 0,transparent 34%),linear-gradient(145deg,#8d281f,#b94b20 52%,#57251f)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:42px 42px}
header{position:relative;z-index:1;text-align:center;flex:none;padding:clamp(8px,2vh,20px) 12px 10px}
.eyebrow{font-size:clamp(.55rem,1.2vw,.75rem);letter-spacing:.24em;font-weight:900;color:#ffe4a6}
h1{font:700 clamp(1.8rem,5vh,3.5rem)/.98 Fredoka,cursive;margin:5px 0;text-shadow:0 4px 0 #74251f,0 8px 18px #42150d66}
.subtitle{font-size:clamp(.68rem,1.5vh,.9rem);margin:5px auto 7px;color:#ffedcf}
.countdown{display:inline-block;padding:6px 13px;border:1px solid #ffffff50;border-radius:30px;background:#54231f66;font-size:clamp(.62rem,1.3vh,.8rem);font-weight:900}
main{position:relative;z-index:1;flex:1;min-height:0;width:min(1100px,96vw);margin:0 auto;padding:0 0 max(8px,env(safe-area-inset-bottom))}
.calendar{height:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(5px,1.1vw,12px);padding:clamp(7px,1.3vw,14px);border:1px solid #ffffff45;border-radius:clamp(14px,2vw,24px);background:linear-gradient(135deg,#ffffff22,#3e171d55);box-shadow:0 16px 45px #32100d66,inset 0 1px #ffffff55;backdrop-filter:blur(10px)}
.door{position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:clamp(8px,1.3vw,15px);overflow:visible;cursor:pointer;background:linear-gradient(145deg,#fff0d5,#e7b56c);box-shadow:0 4px 0 #6b2b20,0 7px 14px #35120d66;perspective:900px;isolation:isolate}
.door:nth-child(3n){background:linear-gradient(145deg,#d9f0dc,#80bd91)}.door:nth-child(4n){background:linear-gradient(145deg,#fff0c1,#e2a34a)}
.door:focus-visible{outline:3px solid white;outline-offset:3px}.door:disabled{cursor:not-allowed;filter:saturate(.65)}
.gift-image{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain;object-position:center bottom;border-radius:9px;opacity:0;transform:scale(.72) translateY(12px);transition:opacity .3s .2s,transform .45s .2s;z-index:0;filter:drop-shadow(0 3px 3px #4b211d55)}
.door.opened .gift-image{opacity:1;transform:scale(1) translateY(0)}
.door-front{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #ffffff80;border-radius:inherit;color:#fff9e9;background:linear-gradient(145deg,#e75d40,#a92729);box-shadow:inset 0 1px 5px #ffffff55;transform-origin:left center;backface-visibility:hidden;transition:transform .75s cubic-bezier(.2,.75,.25,1),filter .2s}
.door:nth-child(3n) .door-front{background:linear-gradient(145deg,#24845d,#10513e)}.door:nth-child(4n) .door-front{background:linear-gradient(145deg,#e5a83d,#a85b1d)}
.door-front:before{content:"";position:absolute;inset:6px;border:1px solid #ffffff60;border-radius:7px;pointer-events:none}
.door:hover:not(:disabled):not(.opened) .door-front{filter:brightness(1.12)}
.number{font:700 clamp(1.25rem,4.5vh,2.7rem)/1 Fredoka,cursive;text-shadow:0 3px 0 #0003}
.door-label{font-size:clamp(.45rem,1.1vh,.65rem);letter-spacing:.07em;font-weight:900;margin-top:5px;color:#ffe9c7}
.door.opened .door-front{transform:perspective(700px) rotateY(-112deg);pointer-events:none}
.door.opened .number{color:#ffd36a}
.door:disabled .door-front{filter:saturate(.55) brightness(.86)}
.door:disabled .door-label{opacity:.8}
@media(max-width:650px){header{padding:7px 8px 7px}h1{font-size:clamp(1.55rem,4.5vh,2.4rem)}.subtitle{margin:3px auto 5px}.calendar{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:clamp(4px,1vw,8px);padding:7px}main{width:98vw}.door{border-radius:9px}.door-front:before{inset:4px}.gift-image{inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}}
@media(max-height:620px){header{padding-top:5px;padding-bottom:5px}h1{font-size:clamp(1.45rem,4vh,2.3rem)}.subtitle{display:none}.countdown{padding:4px 10px}main{width:min(1050px,97vw)}.calendar{gap:6px;padding:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head>
<body>
<header><div class="eyebrow">A LITTLE BIT OF CHRISTMAS MAGIC</div><h1>Christmas Calendar</h1><p class="subtitle">24 little doors. A new surprise every day from 1 December.</p><div class="countdown" id="status">Come back each day to open the next door</div></header>
<main><section class="calendar" id="calendar" aria-label="24-day Christmas advent calendar"></section></main>
<script>
const images=["01-santa.png","Edit this image using this instruction_ “NO BACKGROUND” (1).jpg","Edit this image using this instruction_ “NO BACKGROUND” (2).jpg","Edit this image using this instruction_ “NO BACKGROUND” (3).jpg","Edit this image using this instruction_ “NO BACKGROUND” (4).jpg","Edit this image using this instruction_ “NO BACKGROUND” (5).jpg","Edit this image using this instruction_ “NO BACKGROUND” (6).jpg","Edit this image using this instruction_ “NO BACKGROUND”.jpg","Edit this image using this instruction_ “NO BACROUNd”.jpg","Edit this image using this instruction_ “full image no background” (1).jpg","Edit this image using this instruction_ “full image no background”.jpg","Edit this image using this instruction_ “no background”.jpg","Edit this image using this instruction_ “no hands no bg”.jpg","Generate a new image matching the description below._Use the attached image only as inspiration for the artistic style._Invent a fresh composition rather than reproducing the reference's layout._Choose an imaginative pose, viewpoint, fr (1).jpg","Generate a new image matching the description below._Use the attached image only as inspiration for the artistic style._Invent a fresh composition rather than reproducing the reference's layout._Choose an imaginative pose, viewpoint, fr (2).jpg","Generate a new image matching the description below._Use the attached image only as inspiration for the artistic style._Invent a fresh composition rather than reproducing the reference's layout._Choose an imaginative pose, viewpoint, framin.jpg","create a cute baulble in this excact style no hands no bg.jpg"];
const calendar=document.getElementById('calendar');
const status=document.getElementById('status');
const today=new Date();const unlocked=today.getMonth()===11?today.getDate():0;
const STORAGE_KEY='rohansweb-christmas-calendar-opened-v1';
function readOpened(){try{const a=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return new Set(Array.isArray(a)?a.filter(n=>Number.isInteger(n)&&n>=1&&n<=24):[])}catch{return new Set()}}
const opened=readOpened();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...opened].sort((a,b)=>a-b)))}catch{}}
function imagePath(file){return './'+encodeURIComponent(file).replace(/%2F/gi,'/')}
function makeDoor(day){
 const button=document.createElement('button');
 button.type='button';button.className='door';button.disabled=day>unlocked;
 button.setAttribute('aria-label',(day>unlocked?'Locked':'Open')+' day '+day);
 const img=document.createElement('img');img.className='gift-image';img.alt='Christmas character for day '+day;img.loading='lazy';img.src=imagePath(images[(day-1)%images.length]);
 const front=document.createElement('span');front.className='door-front';
 const number=document.createElement('span');number.className='number';number.textContent=String(day).padStart(2,'0');
 const label=document.createElement('span');label.className='door-label';label.textContent=day>unlocked?'LOCKED':'OPEN GIFT';
 front.append(number,label);button.append(img,front);
 if(opened.has(day)){button.classList.add('opened');label.textContent='OPENED';button.setAttribute('aria-label','Day '+day+' opened')}
 if(day<=unlocked)button.addEventListener('click',()=>{if(button.classList.contains('opened'))return;opened.add(day);save();button.classList.add('opened');label.textContent='OPENED';button.setAttribute('aria-label','Day '+day+' opened')});
 calendar.append(button);
}
for(let day=1;day<=24;day++)makeDoor(day);
if(true && unlocked===0)status.textContent='The first door unlocks on 1 December';
else if(!true && unlocked<24)status.textContent='Day '+unlocked+' is ready to open';
</script></body></html>
