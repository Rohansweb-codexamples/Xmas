<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reindeer Dash | Christmas Wonderland</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0e2d48,#24634f);color:#fff;font-family:Nunito,Arial,sans-serif;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,5vw,60px);background:#071e35aa;border-bottom:1px solid #ffffff30}header a{color:white;text-decoration:none;font-weight:1000}.wrap{max-width:1100px;margin:34px auto;padding:0 20px}h1{font:700 clamp(38px,6vw,64px) Fredoka;margin:0 0 8px}.intro{color:#d7e9e4;font-weight:700}.panel{margin-top:24px;background:#fff;color:#193b48;border-radius:24px;padding:24px;box-shadow:0 20px 55px #061c2c55}.btn{border:0;border-radius:30px;background:#f3ca70;color:#263d42;padding:12px 18px;font-weight:1000;margin:5px}.soft{background:#e8f0ec}.small{font-size:12px;color:#667d7d;font-weight:800}img{max-width:100%}@media(max-width:600px){.wrap{margin:22px auto}.panel{padding:16px}}<style>.game{max-width:850px;margin:auto}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:1000;margin-bottom:12px}.hud span{background:#eaf3ee;padding:10px 14px;border-radius:12px}.track{width:100%;height:auto;display:block;border-radius:18px;background:#e8f7fa;touch-action:pan-y}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.status{text-align:center;font-weight:900;color:#39705c;min-height:24px}</style></head><body><header><a href="./">← Christmas Wonderland</a><a href="calendar.html">Advent Calendar →</a></header><main class="wrap game"><h1>Reindeer Dash</h1><p class="intro">Help the reindeer race across the snowy trail. Collect golden stars, dodge the snowmen and see how far you can get.</p><section class="panel"><div class="hud"><span>⭐ Score: <b id="score">0</b></span><span>❤️ Lives: <b id="lives">3</b></span><span>🏆 Best: <b id="best">0</b></span></div><canvas id="track" class="track" width="840" height="440"></canvas><div class="controls"><button class="btn" id="start">Start race</button><button class="btn soft" id="left">← Left</button><button class="btn soft" id="right">Right →</button></div><p class="status" id="status">Press Start race. Use ← → or A and D to change lanes.</p></section></main><script>
const c=document.getElementById('track'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');let lane=1,score=0,lives=3,best=+(localStorage.getItem('xmas-race-best')||0),items=[],running=false,last=0,spawn=0,raf=0;bestEl.textContent=best;const centers=[140,420,700];function paint(){x.clearRect(0,0,840,440);let g=x.createLinearGradient(0,0,0,440);g.addColorStop(0,'#bde5f0');g.addColorStop(.68,'#edf9f8');g.addColorStop(.69,'#fff');g.addColorStop(1,'#d8edf0');x.fillStyle=g;x.fillRect(0,0,840,440);x.strokeStyle='#a9d0d9';x.lineWidth=4;x.setLineDash([15,18]);x.beginPath();x.moveTo(280,0);x.lineTo(280,440);x.moveTo(560,0);x.lineTo(560,440);x.stroke();x.setLineDash([]);x.font='66px serif';x.textAlign='center';x.fillText('🦌',centers[lane],360);x.font='24px serif';x.fillText('🛷',centers[lane],395);items.forEach(o=>{x.font=o.type==='star'?'38px serif':'48px serif';x.fillText(o.type==='star'?'⭐':'☃️',centers[o.lane],o.y)})}function hud(){scoreEl.textContent=score;livesEl.textContent=lives}function end(){running=false;cancelAnimationFrame(raf);if(score>best){best=score;localStorage.setItem('xmas-race-best',best);bestEl.textContent=best}statusEl.textContent='Race over! You collected '+score+' points. Press Race again to beat your best.';paint()}function frame(t){if(!running)return;let dt=Math.min(32,t-last||16);last=t;if(t-spawn>Math.max(400,900-score*2)){items.push({lane:Math.floor(Math.random()*3),y:-40,type:Math.random()<.58?'star':'snow'});spawn=t}items.forEach(o=>o.y+=dt*.22);items=items.filter(o=>{if(o.y>460)return false;if(!o.hit&&o.y>320&&o.y<380&&o.lane===lane){o.hit=true;if(o.type==='star')score+=10;else{lives--;if(lives<=0){hud();end();return false}}hud()}return true});paint();raf=requestAnimationFrame(frame)}function move(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}document.getElementById('start').onclick=()=>{cancelAnimationFrame(raf);lane=1;score=0;lives=3;items=[];last=0;spawn=0;running=true;hud();statusEl.textContent='Go! Watch the lanes!';raf=requestAnimationFrame(frame)};document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1)});c.addEventListener('pointerdown',e=>{if(!running)return;let r=c.getBoundingClientRect(),v=(e.clientX-r.left)/r.width;lane=v<.33?0:v>.66?2:1});paint();</script></body></html>
